<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C# Compiler - .NET 8 WASM</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        h1 { color: #569cd6; }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            background: #2d2d30;
            color: #cccccc;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
        }
        .tab.active {
            background: #0e639c;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .file-section {
            margin-bottom: 15px;
        }
        .file-section h4 {
            color: #4ec9b0;
            margin: 5px 0;
        }
        textarea {
            width: 100%;
            background: #252526;
            color: #d4d4d4;
            border: 1px solid #3c3c3c;
            padding: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
        }
        .small-textarea {
            height: 150px;
        }
        .large-textarea {
            height: 400px;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover { background: #1177bb; }
        button:disabled { background: #666; cursor: not-allowed; }
        #output {
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            padding: 10px;
            min-height: 400px;
            white-space: pre-wrap;
            font-family: 'Consolas', 'Courier New', monospace;
        }
        .error { color: #f48771; }
        .success { color: #4ec9b0; }
    </style>
</head>
<body>
    <h1>C# Compiler - .NET 8 WASM</h1>
    <p>Write C# code and run it in your browser!</p>
    
    <div class="tabs">
        <button class="tab active" onclick="switchTab('single')">Single File</button>
        <button class="tab" onclick="switchTab('multiple')">Multiple Files</button>
    </div>

    <!-- Single File Tab -->
    <div id="single" class="tab-content active">
        <div class="container">
            <div>
                <h3>C# Code:</h3>
                <textarea id="code" class="large-textarea">using System;

class Program
{
    static void Main()
    {
        Console.WriteLine("Hello from C# in WASM!");
        Console.WriteLine($"Current time: {DateTime.Now}");
        
        for (int i = 1; i <= 5; i++)
        {
            Console.WriteLine($"Count: {i}");
        }
    }
}</textarea>
                <button id="runBtn" onclick="runCode()">Run Code</button>
            </div>
            <div>
                <h3>Output:</h3>
                <div id="output">Loading .NET runtime...</div>
            </div>
        </div>
    </div>

    <!-- Multiple Files Tab -->
    <div id="multiple" class="tab-content">
        <div class="container">
            <div>
                <h3>Additional Files:</h3>
                
                <div class="file-section">
                    <h4>Person.cs</h4>
                    <textarea id="file1" class="small-textarea">using System;

namespace MyApp.Models
{
    public class Person
    {
        public string Name { get; set; }
        public int Age { get; set; }
        
        public void Greet()
        {
            Console.WriteLine($"Hello, I'm {Name} and I'm {Age} years old!");
        }
    }
}</textarea>
                </div>

                <div class="file-section">
                    <h4>Calculator.cs</h4>
                    <textarea id="file2" class="small-textarea">using System;

namespace MyApp.Services
{
    public static class Calculator
    {
        public static int Add(int a, int b) => a + b;
        public static int Multiply(int a, int b) => a * b;
    }
}</textarea>
                </div>

                <h3>Main Program:</h3>
                <textarea id="mainCode" class="small-textarea">using System;
using MyApp.Models;
using MyApp.Services;

class Program
{
    static void Main()
    {
        var person = new Person 
        { 
            Name = "Alice", 
            Age = 30 
        };
        
        person.Greet();
        
        int sum = Calculator.Add(5, 3);
        Console.WriteLine($"5 + 3 = {sum}");
        
        int product = Calculator.Multiply(4, 7);
        Console.WriteLine($"4 × 7 = {product}");
    }
}</textarea>
                <button id="runMultiBtn" onclick="runMultipleFiles()">Run Multiple Files</button>
            </div>
            <div>
                <h3>Output:</h3>
                <div id="multiOutput">Loading .NET runtime...</div>
            </div>
        </div>
    </div>

    <script type="module" src="/managed/main.js"></script>
    <script>
        function setOutput(el, text, className) {
            el.textContent = '';
            const span = document.createElement('span');
            span.className = className;
            span.textContent = text;
            el.appendChild(span);
        }

        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update tab content
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
        }

        async function runCode() {
            const output = document.getElementById('output');
            const btn = document.getElementById('runBtn');
            const code = document.getElementById('code').value;
            
            try {
                btn.disabled = true;
                output.textContent = 'Compiling and running...';

                // Wait for C# runtime to be ready
                while (!window.CSharpCompiler) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                }

                const result = window.CSharpCompiler.compileAndRun(code);

                if (result.startsWith('COMPILATION_ERROR')) {
                    setOutput(output, result, 'error');
                } else if (result.startsWith('RUNTIME_ERROR')) {
                    setOutput(output, result, 'error');
                } else {
                    setOutput(output, result || '(no output)', 'success');
                }
            } catch (error) {
                setOutput(output, `Error: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function runMultipleFiles() {
            const output = document.getElementById('multiOutput');
            const btn = document.getElementById('runMultiBtn');
            const mainCode = document.getElementById('mainCode').value;
            const file1 = document.getElementById('file1').value;
            const file2 = document.getElementById('file2').value;
            
            try {
                btn.disabled = true;
                output.textContent = 'Compiling and running...';

                // Wait for C# runtime to be ready
                while (!window.CSharpCompiler) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                }

                // Build files JSON
                const files = {
                    'Models/Person.cs': file1,
                    'Services/Calculator.cs': file2
                };
                const filesJson = JSON.stringify(files);

                const result = window.CSharpCompiler.compileAndRunMultiple(mainCode, filesJson);

                if (result.startsWith('COMPILATION_ERROR')) {
                    setOutput(output, result, 'error');
                } else if (result.startsWith('RUNTIME_ERROR')) {
                    setOutput(output, result, 'error');
                } else if (result.startsWith('ERROR:')) {
                    setOutput(output, result, 'error');
                } else {
                    setOutput(output, result || '(no output)', 'success');
                }
            } catch (error) {
                setOutput(output, `Error: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
            }
        }
        
        // Auto-run on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (window.CSharpCompiler) {
                    setOutput(document.getElementById('output'), '✓ C# Compiler ready! Click "Run Code" to execute.', 'success');
                    setOutput(document.getElementById('multiOutput'), '✓ C# Compiler ready! Click "Run Multiple Files" to execute.', 'success');
                }
            }, 2000);
        });
    </script>
</body>
</html>
