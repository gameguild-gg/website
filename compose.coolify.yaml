# Coolify deployment - API, web app, and learner app (staging).
#
# Routing: traffic enters via Cloudflare Tunnel -> Coolify's Traefik proxy ->
# this container on the shared Coolify network. Services may use the same
# internal container ports as other Coolify resources; they are routed by
# service/domain, not by globally unique container ports. Avoid hand-written
# generic Traefik service labels such as `api`, `web`, or `website` because
# those names are provider-wide and can collide with other Coolify apps.
#
# Required env vars (set in Coolify -> Resource -> Environment Variables):
#   POSTGRES_HOST, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD,
#   POSTGRES_MIGRATION_CONNECTION,
#   JWT_SECRET_KEY, ENCRYPTION_KEY, ASSET_TOKEN_SECRET_KEY,
#   AUTH_SECRET, API_PUBLIC_URL, WEB_PUBLIC_URL, LEARNING_PUBLIC_URL,
#   PaymentGateways__Stripe__ApiKey,
#   PaymentGateways__Stripe__PublishableKey,
#   PaymentGateways__Stripe__AccountId,
#   Billing__Stripe__WebhookSecret, Billing__Stripe__WebhookEndpointId,
#   Billing__Stripe__ApiVersion, Billing__Stripe__LiveMode
#
# Recommended env vars:
#   JWT_ISSUER, JWT_AUDIENCE
#
# Migration env var:
#   POSTGRES_MIGRATION_CONNECTION
#     Full PostgreSQL connection string for a DDL-capable migration role.
#     Its username must differ from POSTGRES_USER. Startup initialization uses
#     this connection; runtime traffic always uses POSTGRES_USER.
#     Before the first migration, a PostgreSQL administrator must run:
#       psql -v migration_role=<role> -d <database> \
#         -f apps/api/scripts/bootstrap-economy-database.sql
#
# Coolify owns SERVICE_FQDN_* / SERVICE_URL_* variables and service routing.
# Application containers consume explicit public URLs only. Do not pass
# port-suffixed SERVICE_FQDN_*_* values into containers; stale generated values
# can override custom domains in multi-service compose deployments.

services:
  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: game-guild-api
    ports:
      - '8080'
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Staging}
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - DATAPROTECTION_KEYS_PATH=/app/.aspnet/DataProtection-Keys
      - SeedData__ImportSnapshotCourses=${SEED_SNAPSHOT_COURSES:-true}
      # Shared Coolify Postgres
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST:?set POSTGRES_HOST};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:?set POSTGRES_DB};Username=${POSTGRES_USER:?set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD};Include Error Detail=false;Gss Encryption Mode=Disable;Maximum Pool Size=100;Minimum Pool Size=5;Connection Idle Lifetime=300
      - ConnectionStrings__AuthenticationDb=Host=${POSTGRES_HOST:?set POSTGRES_HOST};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:?set POSTGRES_DB};Username=${POSTGRES_USER:?set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD};Include Error Detail=false;Gss Encryption Mode=Disable;Maximum Pool Size=100;Minimum Pool Size=5;Connection Idle Lifetime=300
      - ConnectionStrings__MigrationConnection=${POSTGRES_MIGRATION_CONNECTION:?set POSTGRES_MIGRATION_CONNECTION with a role distinct from POSTGRES_USER}
      - POSTGRES_MIGRATION_CONNECTION=${POSTGRES_MIGRATION_CONNECTION:?set POSTGRES_MIGRATION_CONNECTION with a role distinct from POSTGRES_USER}
      - Database__RunStartupInitialization=true
      - Database__GrantRuntimeRoleAfterMigrations=true
      - Database__FailStartupOnMigrationFailure=true
      - Database__FailStartupOnSeedFailure=true
      - Database__FailStartupOnGrantFailure=true
      # JWT configuration consumed by the API and auth services
      - Jwt__SecretKey=${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-GameGuild}
      - Jwt__Audience=${JWT_AUDIENCE:-GameGuild.Users}
      - Authentication__JwtSecretKey=${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      - Authentication__JwtIssuer=${JWT_ISSUER:-GameGuild}
      - Authentication__JwtAudience=${JWT_AUDIENCE:-GameGuild.Users}
      - Authentication__JwtExpiration=${JWT_EXPIRATION:-24:00:00}
      - Encryption__Key=${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      - Encryption__EncryptionKey=${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      - Redis__Enabled=true
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING:?set REDIS_CONNECTION_STRING}
      - Redis__InstanceName=${REDIS_INSTANCE_NAME:-game-guild:}
      - Assets__Storage__ServiceUrl=${S3_SERVICE_URL:?set S3_SERVICE_URL}
      - Assets__Storage__AccessKey=${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      - Assets__Storage__SecretKey=${S3_SECRET_KEY:?set S3_SECRET_KEY}
      - Assets__Token__SecretKey=${ASSET_TOKEN_SECRET_KEY:?set ASSET_TOKEN_SECRET_KEY}
      - Assets__Storage__Region=${S3_REGION:-garage}
      - Assets__Storage__BucketName=${S3_BUCKET:?set S3_BUCKET}
      - Assets__Storage__TransformedBucketName=${S3_BUCKET_TRANSFORMED:-}
      - Assets__Storage__QuarantineBucketName=${S3_BUCKET_QUARANTINE:-}
      - Assets__Storage__ForcePathStyle=true
      - Assets__Storage__PresignedUrlExpiryMinutes=${S3_PRESIGNED_EXPIRY:-60}
      - StatementEmails__ConsoleBaseUrl=${STATEMENTEMAILS__CONSOLEBASEURL:-}
      - EmailDelivery__Enabled=${EMAILDELIVERY__ENABLED:-true}
      - EmailDelivery__Provider=${EMAILDELIVERY__PROVIDER:-Smtp}
      - EmailDelivery__FromEmail=${EMAILDELIVERY__FROMEMAIL:?set EMAILDELIVERY__FROMEMAIL}
      - EmailDelivery__FromName=${EMAILDELIVERY__FROMNAME:-GameGuild}
      - EmailDelivery__SendGridApiKey=${EMAILDELIVERY__SENDGRIDAPIKEY:-}
      - EmailDelivery__SmtpHost=${EMAILDELIVERY__SMTPHOST:-mailhog}
      - EmailDelivery__SmtpPort=${EMAILDELIVERY__SMTPPORT:-1025}
      - EmailDelivery__SmtpUsername=${EMAILDELIVERY__SMTPUSERNAME:-}
      - EmailDelivery__SmtpPassword=${EMAILDELIVERY__SMTPPASSWORD:-}
      - EmailDelivery__SmtpUseSsl=${EMAILDELIVERY__SMTPUSESSL:-false}
      # Canonical Stripe sections consumed by Payments and Billing.
      - PaymentGateways__Stripe__IsEnabled=true
      - PaymentGateways__Stripe__UseSimulation=false
      - PaymentGateways__Stripe__ApiKey=${PaymentGateways__Stripe__ApiKey:?set PaymentGateways__Stripe__ApiKey}
      - PaymentGateways__Stripe__PublishableKey=${PaymentGateways__Stripe__PublishableKey:?set PaymentGateways__Stripe__PublishableKey}
      - PaymentGateways__Stripe__AccountId=${PaymentGateways__Stripe__AccountId:?set PaymentGateways__Stripe__AccountId}
      - PaymentGateways__Stripe__ConnectedAccountId=${Billing__Stripe__ConnectedAccountId:-}
      - PaymentGateways__Stripe__LiveMode=${Billing__Stripe__LiveMode:-false}
      - Billing__Stripe__WebhookSecret=${Billing__Stripe__WebhookSecret:?set Billing__Stripe__WebhookSecret}
      - Billing__Stripe__WebhookEndpointId=${Billing__Stripe__WebhookEndpointId:?set Billing__Stripe__WebhookEndpointId}
      - Billing__Stripe__AccountId=${PaymentGateways__Stripe__AccountId:?set PaymentGateways__Stripe__AccountId}
      - Billing__Stripe__ApiVersion=${Billing__Stripe__ApiVersion:?set Billing__Stripe__ApiVersion}
      - Billing__Stripe__ConnectedAccountId=${Billing__Stripe__ConnectedAccountId:-}
      - Billing__Stripe__LiveMode=${Billing__Stripe__LiveMode:-false}
      - Billing__Stripe__WebhookToleranceSeconds=${Billing__Stripe__WebhookToleranceSeconds:-300}
    volumes:
      - dataprotection-keys-v2:/app/.aspnet/DataProtection-Keys
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/live || exit 1']
      start_interval: 5s
      start_period: 180s
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    labels:
      - 'com.game-guild.app=api'
      - 'com.game-guild.tier=backend'
      - 'com.game-guild.environment=staging'
      - 'traefik.docker.network=coolify'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      default:
        aliases:
          - api
          - gameguild-api-internal
      coolify: {}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-}
        AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
        API_INTERNAL_URL: http://backend:8080
        API_PUBLIC_URL: ${API_PUBLIC_URL:?set API_PUBLIC_URL}
        WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:?set WEB_PUBLIC_URL}
        AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
    image: game-guild-web
    ports:
      - '3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - API_URL=http://backend:8080
      - NEXT_PUBLIC_API_URL=${API_PUBLIC_URL:?set API_PUBLIC_URL}
      - NEXT_PUBLIC_APP_URL=${WEB_PUBLIC_URL:?set WEB_PUBLIC_URL}
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL:?set WEB_PUBLIC_URL}
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
      - NEXTAUTH_URL=${WEB_PUBLIC_URL:?set WEB_PUBLIC_URL}
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET}
      - AUTH_TRUST_HOST=true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3000/manifest.webmanifest').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\"",
        ]
      start_interval: 10s
      start_period: 90s
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    labels:
      - 'com.game-guild.app=web'
      - 'com.game-guild.tier=frontend'
      - 'com.game-guild.environment=staging'
      - 'traefik.docker.network=coolify'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - default
      - coolify
    depends_on:
      backend:
        condition: service_started

  learning:
    build:
      context: .
      dockerfile: apps/learning/Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-}
        AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
        API_INTERNAL_URL: http://backend:8080
        API_PUBLIC_URL: ${API_PUBLIC_URL:?set API_PUBLIC_URL}
        LEARNING_PUBLIC_URL: ${LEARNING_PUBLIC_URL:?set LEARNING_PUBLIC_URL}
        WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:?set WEB_PUBLIC_URL}
        AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
    image: game-guild-learning
    ports:
      - '3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - API_URL=http://backend:8080
      - NEXT_PUBLIC_API_URL=${API_PUBLIC_URL:?set API_PUBLIC_URL}
      - NEXTAUTH_URL=${LEARNING_PUBLIC_URL:?set LEARNING_PUBLIC_URL}
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - NEXT_PUBLIC_WEB_URL=${WEB_PUBLIC_URL:?set WEB_PUBLIC_URL}
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3000/sign-in').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\"",
        ]
      start_interval: 10s
      start_period: 90s
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    labels:
      - 'com.game-guild.app=learning'
      - 'com.game-guild.tier=frontend'
      - 'com.game-guild.environment=staging'
      - 'traefik.docker.network=coolify'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - default
      - coolify
    depends_on:
      backend:
        condition: service_started

networks:
  coolify:
    external: true

volumes:
  dataprotection-keys-v2:
    driver: local
