<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">GameGuild social post layout example</title>
  <desc id="description">A sample social post layout showing the GameGuild logo, clear margins, placeholder campaign copy, and the four-color palette.</desc>
  <rect width="1200" height="630" fill="#F8FAFC" />
  <rect x="0" y="0" width="1200" height="16" fill="#3B97D3" />
  <circle cx="1100" cy="95" r="150" fill="#FFBF46" opacity="0.22" />
  <circle cx="1130" cy="558" r="112" fill="#3AC03A" opacity="0.14" />
  <rect x="64" y="56" width="1072" height="518" rx="20" fill="none" stroke="#94A3B8" stroke-dasharray="8 8" stroke-width="2" />
  <g transform="translate(92 78) scale(.46)">
    <circle cx="72" cy="25" r="22" fill="#FFBF46" />
    <circle cx="25" cy="72" r="22" fill="#3B97D3" />
    <circle cx="119" cy="72" r="22" fill="#E6473C" />
    <circle cx="72" cy="119" r="22" fill="#3AC03A" />
    <text x="172" y="97" fill="#020617" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="650" letter-spacing="-2">GameGuild</text>
  </g>
  <text x="92" y="288" fill="#020617" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700">YOUR CAMPAIGN HEADLINE</text>
  <text x="94" y="340" fill="#334155" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">Replace this placeholder with approved campaign copy.</text>
  <rect x="94" y="390" width="240" height="8" rx="4" fill="#3B97D3" />
  <text x="600" y="604" fill="#475569" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" letter-spacing="1.2">SAFE AREA EXAMPLE • KEEP LOGOS AND KEY COPY INSIDE THE DASHED MARGIN</text>
</svg>
