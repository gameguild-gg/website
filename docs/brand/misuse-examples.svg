<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Incorrect GameGuild logo usage examples</title>
  <desc id="description">Do not stretch, rotate, or recolor the GameGuild mark. Each example is crossed out.</desc>
  <rect width="1200" height="360" rx="20" fill="#F8FAFC" />
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g transform="translate(60 35)">
      <rect width="320" height="290" rx="18" fill="#FFFFFF" stroke="#CBD5E1" />
      <g transform="translate(104 76) scale(1.35 .75)">
        <circle cx="72" cy="25" r="22" fill="#FFBF46" />
        <circle cx="25" cy="72" r="22" fill="#3B97D3" />
        <circle cx="119" cy="72" r="22" fill="#E6473C" />
        <circle cx="72" cy="119" r="22" fill="#3AC03A" />
      </g>
      <path d="M110 82 220 205M220 82 110 205" stroke="#DC2626" stroke-width="10" stroke-linecap="round" />
      <text x="160" y="260" fill="#7F1D1D" font-size="20" font-weight="700">DO NOT STRETCH</text>
    </g>
    <g transform="translate(440 35)">
      <rect width="320" height="290" rx="18" fill="#FFFFFF" stroke="#CBD5E1" />
      <g transform="translate(88 76) rotate(24 72 72)">
        <circle cx="72" cy="25" r="22" fill="#FFBF46" />
        <circle cx="25" cy="72" r="22" fill="#3B97D3" />
        <circle cx="119" cy="72" r="22" fill="#E6473C" />
        <circle cx="72" cy="119" r="22" fill="#3AC03A" />
      </g>
      <path d="M110 82 220 205M220 82 110 205" stroke="#DC2626" stroke-width="10" stroke-linecap="round" />
      <text x="160" y="260" fill="#7F1D1D" font-size="20" font-weight="700">DO NOT ROTATE</text>
    </g>
    <g transform="translate(820 35)">
      <rect width="320" height="290" rx="18" fill="#FFFFFF" stroke="#CBD5E1" />
      <g transform="translate(88 76)">
        <circle cx="72" cy="25" r="22" fill="#7C3AED" />
        <circle cx="25" cy="72" r="22" fill="#F97316" />
        <circle cx="119" cy="72" r="22" fill="#0F766E" />
        <circle cx="72" cy="119" r="22" fill="#DB2777" />
      </g>
      <path d="M110 82 220 205M220 82 110 205" stroke="#DC2626" stroke-width="10" stroke-linecap="round" />
      <text x="160" y="260" fill="#7F1D1D" font-size="20" font-weight="700">DO NOT RECOLOR</text>
    </g>
  </g>
</svg>
