name: Emception CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      publish_packages:
        description: Publish a validated, already-versioned Emception release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: emception-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.0.0'

jobs:
  detect-emception-changes:
    name: Detect Emception changes
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.changes.outputs.required }}
      heavy: ${{ steps.changes.outputs.heavy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v4
        with:
          fetch-depth: 0

      - name: Determine validation scope
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          required=false
          heavy=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            required=true
            heavy=true
          else
            BASE_SHA="$EVENT_BEFORE"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              BASE_SHA="$PR_BASE_SHA"
            fi
            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
              required=true
              heavy=true
            else
              CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
              if grep -Eq '^(\.changeset/|\.github/workflows/emception\.yml|apps/web/(Dockerfile|scripts/(sync-emception-cdn|coding-cycle-browser-e2e)\.mjs|src/lib/emception/)|demos/emception-[^/]+/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|scripts/devops/(emception-release-policy|publish-emception|version-emception)\.mjs|scripts/sync-emception-cdn\.mjs|tools/emception/)' <<< "$CHANGED"; then
                required=true
              fi
              if grep -Eq '^tools/emception/(toolchain/|scripts/(build-|deploy-|generate-|patch-|populate-|setup-|stage-|toolchain/|warmup-)|package\.json)' <<< "$CHANGED"; then
                heavy=true
              fi
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  build-test-package:
    name: Build, test, and package Emception
    runs-on: ubuntu-latest
    needs: detect-emception-changes
    if: needs.detect-emception-changes.outputs.required == 'true'
    timeout-minutes: 360
    env:
      CI: 'true'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cache immutable Toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/emception/.cache/toolchain/downloads
          key: emception-downloads-linux-${{ hashFiles('tools/emception/toolchain/toolchain.lock.json') }}

      - name: Cache verified Toolchain builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tools/emception/.cache/toolchain/sources
            tools/emception/.cache/toolchain/builds
            tools/emception/.cache/toolchain/emsdk
            tools/emception/artifacts/toolchain/tools
            tools/emception/artifacts/toolchain/sysroot
            tools/emception/artifacts/toolchain/receipts
          key: emception-builds-linux-${{ hashFiles('tools/emception/toolchain/toolchain.lock.json', 'tools/emception/toolchain/overlays/**', 'tools/emception/scripts/toolchain/**', 'tools/emception/scripts/build-*.ts', 'tools/emception/scripts/setup-emsdk.ts', 'tools/emception/scripts/populate-sysroot.ts') }}
          restore-keys: |
            emception-builds-linux-

      - name: Install native Toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing brotli build-essential cmake ninja-build pkg-config

      - name: Free disk space and configure build swap
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          sudo swapoff -a || true
          sudo rm -f /mnt/emception-swapfile
          sudo fallocate -l 32G /mnt/emception-swapfile
          sudo chmod 600 /mnt/emception-swapfile
          sudo mkswap /mnt/emception-swapfile
          sudo swapon /mnt/emception-swapfile
          df -h /
          free -h

      - name: Validate Toolchain lock and overlays
        run: pnpm --dir tools/emception toolchain doctor

      - name: Build and validate Toolchain receipts
        shell: bash
        env:
          HEAVY_REBUILD: ${{ needs.detect-emception-changes.outputs.heavy }}
        run: |
          if [[ "$HEAVY_REBUILD" == "true" ]]; then
            pnpm --dir tools/emception toolchain build all --force
          else
            pnpm --dir tools/emception toolchain build all
          fi

      - name: Build all Emception packages
        run: pnpm run build:emception

      - name: Build generated API client
        run: pnpm --filter @game-guild/client run build

      - name: Type-check all Emception packages
        run: pnpm run typecheck:emception

      - name: Run Emception unit and public type tests
        run: |
          pnpm run test:emception
          pnpm run test:emception:types

      - name: Generate clean release staging and packages
        run: pnpm --dir tools/emception toolchain release

      - name: Verify release gates and npm package contents
        shell: bash
        run: |
          pnpm --dir tools/emception run verify:release
          PACKAGE_DIRS=(core toolchain browser xterm react webcomponent ide)
          for DIR in "${PACKAGE_DIRS[@]}"; do
            npm pack "./tools/emception/packages/${DIR}" --dry-run --json --ignore-scripts >/dev/null
          done

      - name: Install Chromium for browser smoke tests
        run: pnpm --dir tools/emception exec playwright install --with-deps chromium

      - name: Stage CDN into demos
        run: node scripts/sync-emception-cdn.mjs

      - name: Run instructor and learner coding assessment cycle
        run: pnpm --dir apps/web run test:browser:coding-cycle

      - name: Run browser C++ compilation smoke test
        run: pnpm run test:emception:e2e

      - name: Build Emception demo consumers
        run: pnpm --filter "@gameguild/emception-demo-*" --workspace-concurrency=1 run build

      - name: Build GitHub Pages IDE
        run: pnpm --dir demos/emception-ide-react run build
        env:
          VITE_BASE: /gameguild/

      - name: Verify deployable output
        shell: bash
        run: |
          test -f demos/emception-ide-react/dist/index.html
          test -f tools/emception/artifacts/toolchain/release/cdn/manifest.json
          test -f tools/emception/artifacts/toolchain/receipts/release.json
          test -f tools/emception/packages/toolchain/cdn/manifest.json
          test -f tools/emception/packages/core/cdn/manifest.json
          test -f tools/emception/public/cdn/manifest.json
          for DIR in core browser xterm react webcomponent ide; do
            test -d "tools/emception/packages/${DIR}/dist"
          done

      - name: Upload Emception release artifacts
        uses: actions/upload-artifact@v7 # v4
        with:
          name: emception-${{ github.sha }}
          path: |
            demos/emception-ide-react/dist
            tools/emception/artifacts/toolchain/release/cdn
            tools/emception/artifacts/toolchain/receipts
            tools/emception/packages/toolchain/cdn
            tools/emception/packages/core/cdn
            tools/emception/packages/core/dist
            tools/emception/packages/browser/dist
            tools/emception/packages/xterm/dist
            tools/emception/packages/react/dist
            tools/emception/packages/webcomponent/dist
            tools/emception/packages/ide/dist
            tools/emception/public/cdn
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7 # v4
        with:
          name: emception-browser-diagnostics-${{ github.sha }}
          path: |
            tools/emception/playwright-report
            tools/emception/test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy-pages:
    name: Deploy Emception IDE and CDN
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: build-test-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Emception release artifacts
        uses: actions/download-artifact@v8 # v8.0.1
        with:
          name: emception-${{ github.sha }}
          path: _artifacts/emception

      - name: Assemble GitHub Pages payload
        shell: bash
        run: |
          SOURCE="_artifacts/emception"
          test -f "${SOURCE}/demos/emception-ide-react/dist/index.html"
          test -f "${SOURCE}/tools/emception/public/cdn/manifest.json"
          rm -rf .pages
          mkdir -p .pages
          cp -R "${SOURCE}/demos/emception-ide-react/dist/." .pages/
          rm -rf .pages/cdn
          cp -R "${SOURCE}/tools/emception/public/cdn" .pages/cdn
          find .pages -name '.gitignore' -delete

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6 # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5 # v5.0.0
        with:
          path: .pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  version-or-publish:
    name: Create version PR or publish Emception
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_packages)
    needs: build-test-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          lfs: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Configure npm registry
        uses: actions/setup-node@v7 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download validated release artifacts
        uses: actions/download-artifact@v8 # v8.0.1
        with:
          name: emception-${{ github.sha }}
          path: _artifacts/emception

      - name: Restore validated release outputs
        shell: bash
        run: |
          rsync -a _artifacts/emception/tools/emception/ tools/emception/

      - name: Create or update the Emception version PR
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm run version:emception
          commit-message: 'chore(release): version Emception packages'
          pr-title: 'chore(release): version Emception packages'

      - name: Publish validated packages
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm run publish:emception
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the published Emception release
        if: steps.changesets.outputs.hasChangesets == 'false'
        shell: bash
        run: |
          VERSION="$(node -p "require('./tools/emception/packages/core/package.json').version")"
          TAG="emception-v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} already exists; skipping."
            exit 0
          fi
          git config user.name "gameguild-release-bot"
          git config user.email "noreply@gameguild.gg"
          git tag "${TAG}"
          git push origin "${TAG}"
