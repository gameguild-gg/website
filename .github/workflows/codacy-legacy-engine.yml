name: Codacy legacy engine contracts

on:
  pull_request:
    branches: [main, develop, "feature/**"]
    paths:
      - ".codacy/legacy-eslint/**"
      - ".github/workflows/codacy-legacy-engine.yml"

permissions:
  contents: read

concurrency:
  group: codacy-legacy-engine-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Original and repaired engine contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENGINE_IMAGE: codacy/codacy-eslint@sha256:01b7b1444a44d33aba5db47aa0f244c889ab24de35a5960536f8ff2b6ca206f1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pull the pinned public engine release
        run: docker pull "$ENGINE_IMAGE"
      - name: Verify the original failures and effective pattern inventory
        run: |
          mkdir -p engine-evidence
          set -o pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            -e GAMEGUILD_ENGINE_EXPECT_REPAIRED=false \
            -v "$PWD:/src:ro" "$ENGINE_IMAGE" \
            node --test /src/.codacy/legacy-eslint/engine-contracts.cjs \
            2>&1 | tee engine-evidence/original.tap
      - name: Build an isolated repaired engine
        run: |
          set -o pipefail
          docker build --network=none --progress=plain -t gameguild-codacy-engine-contracts \
            .codacy/legacy-eslint |& tee engine-evidence/repair-build.log
      - name: Verify repaired rules retain the positive and negative detections
        run: |
          set -o pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            -e GAMEGUILD_ENGINE_EXPECT_REPAIRED=true \
            -v "$PWD:/src:ro" gameguild-codacy-engine-contracts \
            node --test /src/.codacy/legacy-eslint/engine-contracts.cjs \
            2>&1 | tee engine-evidence/repaired.tap
      - name: Record source and immutable engine identity
        if: always()
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p engine-evidence
          printf '%s\n' "$CANDIDATE_HEAD" > engine-evidence/head.txt
          git rev-parse HEAD > engine-evidence/checkout.txt
          git rev-parse 'HEAD^{tree}' > engine-evidence/tree.txt
          printf '%s\n' "$ENGINE_IMAGE" > engine-evidence/engine-image.txt
          sha256sum .codacy/legacy-eslint/effective-patterns.json > engine-evidence/profile.sha256
      - name: Upload original and repaired evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codacy-legacy-engine-${{ github.event.pull_request.head.sha }}
          path: engine-evidence
          if-no-files-found: error
