name: Production Release

on:
  workflow_dispatch:
    inputs:
      hotfix_ref:
        description: Existing hotfix/* branch with a green PR Verify run
        required: true
        type: string
      incident:
        description: Incident or change record authorizing this hotfix
        required: true
        type: string
      confirmation:
        description: Type DEPLOY HOTFIX to confirm the audited exception
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve tested release candidate
    runs-on: ubuntu-latest
    outputs:
      runtimeChanged: ${{ steps.classify.outputs.runtimeChanged }}
      services: ${{ steps.classify.outputs.runtimeServiceMatrix }}
      migration: ${{ steps.classify.outputs.migration }}
      treeSha: ${{ steps.identity.outputs.treeSha }}
      releaseSha: ${{ steps.base.outputs.releaseSha }}
      releaseMode: ${{ steps.base.outputs.releaseMode }}
      releasedAt: ${{ steps.identity.outputs.releasedAt }}
      verificationRunId: ${{ steps.verification.outputs.runId }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.hotfix_ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Resolve release base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          HOTFIX_REF: ${{ inputs.hotfix_ref }}
          HOTFIX_INCIDENT: ${{ inputs.incident }}
          HOTFIX_CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            branch="${HOTFIX_REF#refs/heads/}"
            if [[ ! "$branch" =~ ^hotfix/.+ ]]; then
              echo 'Manual production releases are restricted to hotfix/* branches.' >&2
              exit 1
            fi
            if [[ "$HOTFIX_CONFIRMATION" != 'DEPLOY HOTFIX' || -z "$HOTFIX_INCIDENT" ]]; then
              echo 'An incident record and the exact DEPLOY HOTFIX confirmation are required.' >&2
              exit 1
            fi

            actor_is_admin=$(gh api "/repos/$REPOSITORY/collaborators/$GITHUB_ACTOR/permission" \
              --jq '.user.permissions.admin // false')
            if [[ "$actor_is_admin" != 'true' ]]; then
              echo "Only a repository administrator may promote a production hotfix; $GITHUB_ACTOR is not an administrator." >&2
              exit 1
            fi

            git fetch origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$branch:refs/remotes/origin/$branch"
            head_sha=$(git rev-parse HEAD)
            if ! git merge-base --is-ancestor origin/main "$head_sha"; then
              echo 'The hotfix branch must contain the latest main commit.' >&2
              exit 1
            fi

            pr_json=$(gh api "/repos/$REPOSITORY/commits/$head_sha/pulls")
            pr_number=$(jq -r \
              --arg branch "$branch" \
              'map(select(.state == "open" and .base.ref == "main" and .head.ref == $branch))[0].number // empty' \
              <<<"$pr_json")
            if [[ -z "$pr_number" ]]; then
              echo 'The hotfix must have an open pull request targeting main.' >&2
              exit 1
            fi

            git fetch origin "+refs/pull/$pr_number/merge:refs/remotes/pull/$pr_number/merge"
            git checkout --detach "refs/remotes/pull/$pr_number/merge"
            base=$(git rev-parse origin/main)
            {
              echo "prNumber=$pr_number"
              echo "verificationHead=$head_sha"
              echo "releaseSha=$head_sha"
              echo 'releaseMode=hotfix'
            } >> "$GITHUB_OUTPUT"
            {
              printf '### Audited hotfix\n\n'
              printf -- '- Actor: %s\n' "$GITHUB_ACTOR"
              printf -- '- Branch: %s\n' "$branch"
              printf -- '- PR: #%s\n' "$pr_number"
              printf -- '- Incident: %s\n' "$HOTFIX_INCIDENT"
              printf -- '- Source: %s\n' "$head_sha"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            base="$EVENT_BEFORE"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base=$(git rev-parse HEAD^)
            fi
            {
              echo "releaseSha=$GITHUB_SHA"
              echo 'releaseMode=main'
            } >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Classify release surfaces
        id: classify
        run: >-
          node scripts/ci/classify-release-changes.mjs
          --base "${{ steps.base.outputs.sha }}"
          --head "$(git rev-parse HEAD)"
      - name: Resolve immutable release identity
        id: identity
        run: |
          {
            echo "treeSha=$(git rev-parse 'HEAD^{tree}')"
            echo "releasedAt=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"
      - name: Locate the successful PR verification run
        id: verification
        if: steps.classify.outputs.runtimeChanged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.base.outputs.releaseSha }}
          RELEASE_MODE: ${{ steps.base.outputs.releaseMode }}
          HOTFIX_PR_NUMBER: ${{ steps.base.outputs.prNumber }}
          HOTFIX_VERIFY_HEAD: ${{ steps.base.outputs.verificationHead }}
        run: |
          if [[ "$RELEASE_MODE" == 'hotfix' ]]; then
            pr_number="$HOTFIX_PR_NUMBER"
            head_sha="$HOTFIX_VERIFY_HEAD"
          else
            pr_json=$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$REPOSITORY/commits/$RELEASE_SHA/pulls")
            pr_number=$(jq -r 'map(select(.merged_at != null))[0].number // empty' <<<"$pr_json")
            head_sha=$(jq -r 'map(select(.merged_at != null))[0].head.sha // empty' <<<"$pr_json")
            if [[ -z "$pr_number" || -z "$head_sha" ]]; then
              echo 'The main commit is not associated with a merged pull request.' >&2
              exit 1
            fi
          fi
          run_id=$(gh run list \
            --repo "$REPOSITORY" \
            --workflow pr-verify.yml \
            --event pull_request \
            --status success \
            --commit "$head_sha" \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "No successful PR Verify run exists for PR #$pr_number ($head_sha)." >&2
            exit 1
          fi
          echo "runId=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using PR #$pr_number verification run $run_id."

  promote:
    name: Promote exact candidate digests
    needs: prepare
    if: needs.prepare.outputs.runtimeChanged == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ vars.DEVTRON_REGISTRY_HOST }}
          username: ${{ secrets.DEVTRON_REGISTRY_USERNAME }}
          password: ${{ secrets.DEVTRON_REGISTRY_PASSWORD }}
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2
      - name: Validate registry release configuration
        env:
          REGISTRY_HOST: ${{ vars.DEVTRON_REGISTRY_HOST }}
          REGISTRY_NAMESPACE: ${{ vars.DEVTRON_REGISTRY_NAMESPACE }}
          REGISTRY_USERNAME: ${{ secrets.DEVTRON_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DEVTRON_REGISTRY_PASSWORD }}
        run: |
          for value in "$REGISTRY_HOST" "$REGISTRY_NAMESPACE" "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo 'Devtron registry release configuration is incomplete.' >&2
              exit 1
            fi
          done
          printf '%s' "$REGISTRY_PASSWORD" | oras login "$REGISTRY_HOST" --username "$REGISTRY_USERNAME" --password-stdin
      - name: Download the tested candidate evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_RUN_ID: ${{ needs.prepare.outputs.verificationRunId }}
          TREE_SHA: ${{ needs.prepare.outputs.treeSha }}
        run: >-
          gh run download "$VERIFY_RUN_ID"
          --repo "${{ github.repository }}"
          --pattern "candidate-*-${TREE_SHA}"
          --dir candidate-evidence
      - name: Load previous stable release state
        env:
          STATE_IMAGE: ${{ vars.DEVTRON_REGISTRY_HOST }}/${{ vars.DEVTRON_REGISTRY_NAMESPACE }}/gameguild-release-state
          ALLOW_MISSING_STATE: ${{ vars.ALLOW_INITIAL_RELEASE_WITHOUT_STABLE }}
        run: |
          mkdir -p previous-state
          if oras pull "$STATE_IMAGE:stable" --output previous-state; then
            test -s previous-state/release-manifest.json
          elif [[ "$ALLOW_MISSING_STATE" == 'true' ]]; then
            printf '{"services":[]}\n' > previous-state/release-manifest.json
          else
            echo 'No stable release state exists. Seed and validate staging before production cutover.' >&2
            exit 1
          fi
      - name: Promote candidates without rebuilding
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.releaseSha }}
          TREE_SHA: ${{ needs.prepare.outputs.treeSha }}
          SERVICES_JSON: ${{ needs.prepare.outputs.services }}
          REGISTRY_HOST: ${{ vars.DEVTRON_REGISTRY_HOST }}
          REGISTRY_NAMESPACE: ${{ vars.DEVTRON_REGISTRY_NAMESPACE }}
          VERIFICATION_RUN_ID: ${{ needs.prepare.outputs.verificationRunId }}
          RELEASED_AT: ${{ needs.prepare.outputs.releasedAt }}
          MIGRATION_REQUIRED: ${{ needs.prepare.outputs.migration }}
          PREVIOUS_MANIFEST: previous-state/release-manifest.json
        run: bash scripts/deploy/promote-candidates.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-plan-${{ needs.prepare.outputs.releaseSha }}
          path: artifacts/release
          retention-days: 30
          if-no-files-found: error

  deploy:
    name: Roll out through Devtron
    needs: [prepare, promote]
    if: needs.prepare.outputs.runtimeChanged == 'true' && needs.promote.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-plan-${{ needs.prepare.outputs.releaseSha }}
          path: artifacts/release
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2
      - name: Preflight production and rollback configuration
        env:
          SERVICES_JSON: ${{ needs.prepare.outputs.services }}
          DEVTRON_BASE_URL: ${{ vars.DEVTRON_BASE_URL }}
          DEVTRON_API_TOKEN: ${{ secrets.DEVTRON_API_TOKEN }}
          DEVTRON_EXTERNAL_CI_ID_API: ${{ vars.DEVTRON_EXTERNAL_CI_ID_API }}
          DEVTRON_EXTERNAL_CI_ID_WEB: ${{ vars.DEVTRON_EXTERNAL_CI_ID_WEB }}
          DEVTRON_RELEASE_IDENTITY_CONFIGURED: ${{ vars.DEVTRON_RELEASE_IDENTITY_CONFIGURED }}
          GAMEGUILD_API_URL: ${{ vars.GAMEGUILD_API_URL }}
          GAMEGUILD_WEB_URL: ${{ vars.GAMEGUILD_WEB_URL }}
          GAMEGUILD_SMOKE_ADMIN_EMAIL: ${{ secrets.GAMEGUILD_SMOKE_ADMIN_EMAIL }}
          GAMEGUILD_SMOKE_ADMIN_PASSWORD: ${{ secrets.GAMEGUILD_SMOKE_ADMIN_PASSWORD }}
          GAMEGUILD_SMOKE_PROJECT_ID: ${{ vars.GAMEGUILD_SMOKE_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          for value in \
            "$DEVTRON_BASE_URL" "$DEVTRON_API_TOKEN" \
            "$GAMEGUILD_API_URL" "$GAMEGUILD_WEB_URL" \
            "$GAMEGUILD_SMOKE_ADMIN_EMAIL" "$GAMEGUILD_SMOKE_ADMIN_PASSWORD" \
            "$GAMEGUILD_SMOKE_PROJECT_ID" "$CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_ZONE_ID"; do
            if [[ -z "$value" ]]; then
              echo 'Production release configuration is incomplete.' >&2
              exit 1
            fi
          done
          if [[ "$DEVTRON_RELEASE_IDENTITY_CONFIGURED" != 'true' ]]; then
            echo 'Devtron must inject release SHA, image digest, and deployment time before rollout.' >&2
            exit 1
          fi
          for service in $(jq -r '.[]' <<<"$SERVICES_JSON"); do
            variable="DEVTRON_EXTERNAL_CI_ID_${service^^}"
            if [[ -z "${!variable:-}" ]]; then
              echo "$variable is required." >&2
              exit 1
            fi
            url_variable="GAMEGUILD_${service^^}_URL"
            if [[ -z "${!url_variable:-}" ]]; then
              echo "$url_variable is required." >&2
              exit 1
            fi
          done
      - name: Deploy API before Web and roll back on failure
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.releaseSha }}
          TREE_SHA: ${{ needs.prepare.outputs.treeSha }}
          RELEASED_AT: ${{ needs.prepare.outputs.releasedAt }}
          MIGRATION_REQUIRED: ${{ needs.prepare.outputs.migration }}
          DEVTRON_API_PREDEPLOY_MIGRATIONS: ${{ vars.DEVTRON_API_PREDEPLOY_MIGRATIONS }}
          DEVTRON_BASE_URL: ${{ vars.DEVTRON_BASE_URL }}
          DEVTRON_API_TOKEN: ${{ secrets.DEVTRON_API_TOKEN }}
          DEVTRON_EXTERNAL_CI_ID_API: ${{ vars.DEVTRON_EXTERNAL_CI_ID_API }}
          DEVTRON_EXTERNAL_CI_ID_WEB: ${{ vars.DEVTRON_EXTERNAL_CI_ID_WEB }}
          GAMEGUILD_API_URL: ${{ vars.GAMEGUILD_API_URL }}
          GAMEGUILD_WEB_URL: ${{ vars.GAMEGUILD_WEB_URL }}
          GAMEGUILD_SMOKE_ADMIN_EMAIL: ${{ secrets.GAMEGUILD_SMOKE_ADMIN_EMAIL }}
          GAMEGUILD_SMOKE_ADMIN_PASSWORD: ${{ secrets.GAMEGUILD_SMOKE_ADMIN_PASSWORD }}
          GAMEGUILD_SMOKE_PROJECT_ID: ${{ vars.GAMEGUILD_SMOKE_PROJECT_ID }}
          ROLLOUT_TIMEOUT_MS: "300000"
        run: bash scripts/deploy/rollout-devtron.sh
      - name: Publish stable release state
        env:
          REGISTRY_HOST: ${{ vars.DEVTRON_REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ secrets.DEVTRON_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DEVTRON_REGISTRY_PASSWORD }}
          STATE_IMAGE: ${{ vars.DEVTRON_REGISTRY_HOST }}/${{ vars.DEVTRON_REGISTRY_NAMESPACE }}/gameguild-release-state
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | oras login "$REGISTRY_HOST" --username "$REGISTRY_USERNAME" --password-stdin
          oras push \
            "$STATE_IMAGE:release-${{ needs.prepare.outputs.releaseSha }}" \
            --artifact-type application/vnd.gameguild.release-manifest.v1+json \
            artifacts/release/release-manifest.json:application/json
          oras cp "$STATE_IMAGE:release-${{ needs.prepare.outputs.releaseSha }}" "$STATE_IMAGE:stable"
      - name: Purge Cloudflare after confirmed rollout
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          response=$(curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"purge_everything":true}')
          jq -e '.success == true' <<<"$response" >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: production-release-${{ needs.prepare.outputs.releaseSha }}
          path: artifacts/release
          retention-days: 30
          if-no-files-found: error

  no-runtime-release:
    name: No runtime deployment required
    needs: prepare
    if: needs.prepare.outputs.runtimeChanged != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'The main change does not affect a runtime service.'
