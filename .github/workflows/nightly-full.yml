name: Nightly Full

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full
  cancel-in-progress: false

jobs:
  full-verification:
    name: Full solution, Economy, browser, and OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-workspace
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-playwright
      - name: Run complete verification
        env:
          ECONOMY_GATE_PROFILE: full
          ECONOMY_WHOLE_SOLUTION_JOBS: "2"
          ECONOMY_BASE_SHA: ${{ github.event.before || github.sha }}
        run: bash scripts/ci/verify-economy.sh
      - name: Upload nightly evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-full-${{ github.sha }}
          path: artifacts/test-results
          if-no-files-found: error
