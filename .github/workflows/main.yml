name: Main

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy-gate:
    name: Repository Policy Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('package.json', 'apps/**/package.json') }}

      - name: Verify repository policy
        shell: bash
        run: bash scripts/ci/verify-repository-policy.sh

      - name: Upload repository policy evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-policy-test-results-${{ github.sha }}
          path: artifacts/test-results
          if-no-files-found: error

  economy-pr-gate:
    name: Economy PR Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6 # v6.0.10
        with:
          version: 10.0.0

      - uses: actions/setup-node@v7 # v7.0.0
        with:
          node-version: '22'

      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('package.json', 'apps/**/package.json') }}

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-packages-${{ runner.os }}-${{ hashFiles('apps/api/**/*.csproj', 'apps/api/**/*.props', 'apps/api/**/*.targets', 'apps/api/**/NuGet.config') }}

      - name: Install dependencies
        run: pnpm ci:dependencies

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6 # v6.0.0
        with:
          dotnet-version: '10.0.103'

      - name: Verify economy PR profile
        shell: bash
        env:
          ECONOMY_GATE_PROFILE: pr
          ECONOMY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci/verify-economy.sh

      - name: Upload economy evidence
        if: always()
        uses: actions/upload-artifact@v7 # v4
        with:
          name: economy-pr-test-results-${{ github.sha }}
          path: artifacts/test-results
          if-no-files-found: error

  economy-release-gate:
    name: Economy Release Gate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6 # v6.0.10
        with:
          version: 10.0.0

      - uses: actions/setup-node@v7 # v7.0.0
        with:
          node-version: '22'

      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('package.json', 'apps/**/package.json') }}

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-packages-${{ runner.os }}-${{ hashFiles('apps/api/**/*.csproj', 'apps/api/**/*.props', 'apps/api/**/*.targets', 'apps/api/**/NuGet.config') }}

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package.json', 'apps/web/package.json') }}

      - name: Install dependencies
        run: pnpm ci:dependencies

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6 # v6.0.0
        with:
          dotnet-version: '10.0.103'

      - name: Install Playwright Chromium
        run: pnpm --filter @game-guild/web exec playwright install --with-deps chromium

      - name: Verify economy release profile
        shell: bash
        env:
          ECONOMY_GATE_PROFILE: full
          ECONOMY_WHOLE_SOLUTION_JOBS: '2'
          ECONOMY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci/verify-economy.sh

      - name: Upload economy evidence
        if: always()
        uses: actions/upload-artifact@v7 # v4
        with:
          name: economy-release-test-results-${{ github.sha }}
          path: artifacts/test-results
          if-no-files-found: error

  contributors:
    name: Contributors Visualization
    runs-on: ubuntu-latest
    needs: [economy-release-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7 # v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg and gource
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing ffmpeg gource xvfb

      - name: Make gource script executable
        run: chmod +x ./contributors/gource.sh

      - name: Run headless gource
        run: xvfb-run --auto-servernum env OUTPUT_DIR="${RUNNER_TEMP}/gameguild-gource" ./contributors/gource.sh

      - name: Upload contributors visualization
        uses: actions/upload-artifact@v7 # v4
        with:
          name: contributors-gource-${{ github.sha }}
          path: ${{ runner.temp }}/gameguild-gource
          retention-days: 14
          if-no-files-found: error
