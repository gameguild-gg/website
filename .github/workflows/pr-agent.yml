name: pr-agent
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent:
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'pull_request' ||
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    concurrency:
      # A push to the PR while pr-agent is collecting files makes it abort
      # (IncompletePullRequestFilesError). Cancel the stale run instead of letting
      # it race; the synchronize trigger starts a fresh run on the new head.
      group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - uses: qodo-ai/pr-agent@main
        env:
          # NOTE: Actions GITHUB_TOKEN cannot call GET /user, so the log shows
          # "_resolve_user_login ... Resource not accessible by integration: 403".
          # Expected: pr-agent falls back to github-actions[bot]. Harmless.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OMNI_API_KEY }}
          OPENAI__API_BASE: https://omniroute.gameguild.gg/v1
          CONFIG__MODEL: openai/omo/primary
          CONFIG__FALLBACK_MODELS: '["openai/omo/primary"]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "900000"
          # LLM call deadline; default ai_timeout=120s is too short for
          # big-context calls through the omniroute proxy (30m here).
          CONFIG__AI_TIMEOUT: "1800"
          # Per-call token budget cap: pr-agent uses min(max_model_tokens,
          # custom_model_max_tokens); at 900k the whole big-PR diff packed into
          # ONE call (723k tokens → ~705s prefill silence → CF 524 at 120s,
          # streaming can't help before first byte). At 100k 4 of 7 chunks
          # still hit CF 524 (run 39822917061) — TTFT ~61-97s rides too close
          # to the window edge. 50k → ~15 chunks → per-call TTFT ~30-50s,
          # safely inside the CF window. CUSTOM_MODEL_MAX_TOKENS stays 900000
          # (real 1M context of the backend).
          CONFIG__MAX_MODEL_TOKENS: "50000"
          PR_REVIEWER__ENABLE_LARGE_PR_CHUNKING: "true"
          PR_REVIEWER__MAX_NUMBER_OF_CALLS: "100"
          PR_CODE_SUGGESTIONS__MAX_NUMBER_OF_CALLS: "100"
          # CF free plan kills non-streaming LLM calls at ~120s (524, zone
          # omniroute.gameguild.gg). pr-agent's litellm workaround: force
          # streaming for this OpenAI-compatible endpoint — SSE bytes keep
          # the CF connection alive; pr-agent aggregates the stream itself.
          # Both keys are required together (provider AND api_base substring).
          LITELLM__FORCE_STREAMING_CUSTOM_LLM_PROVIDER: openai
          LITELLM__FORCE_STREAMING_API_BASE_SUBSTRINGS: '["omniroute.gameguild.gg"]'
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "true"