name: Setup .NET workspace
description: Install the pinned .NET SDK and restore its package cache

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: 10.0.103
    - name: Prepare certificate for disposable CI key storage
      shell: bash
      run: bash scripts/ci/prepare-data-protection-test-certificate.sh
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('apps/api/**/*.csproj', 'apps/api/**/*.props', 'apps/api/**/*.targets', 'apps/api/**/NuGet.config') }}
        restore-keys: |
          nuget-${{ runner.os }}-
