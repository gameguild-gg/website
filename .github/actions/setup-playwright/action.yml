name: Setup Playwright Chromium
description: Cache and install the pinned Chromium browser runtime

runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json') }}
        restore-keys: |
          playwright-browsers-${{ runner.os }}-
    - name: Install Chromium
      shell: bash
      run: pnpm --filter @game-guild/web exec playwright install --with-deps chromium
