  - "packages/infrastructure/*"
  - "packages/infrastructure/wasm/*"

  # Tooling (build/dev configs)
  - "packages/tooling/*"

  # Tools & demos
  - "tools/*"
  - "tools/emception/packages/*"
  - "demos/*"

